<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><nav><div class="brand">💰 Personal Finance Tracker</div><div><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('history')}}">Transactions</a><a href="{{url_for('reports')}}">Reports</a><a href="{{url_for('settings')}}">Settings</a><a href="{{url_for('logout')}}">Logout</a></div></nav><main><h1>Settings</h1>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="success">{{m}}</div>{% endfor %}{% endwith %}<section class="panel"><form class="form-grid" method="post"><label>Monthly Budget<input type="number" step="0.01" name="budget" value="{{user['budget']}}"></label><label>Savings Goal<input type="number" step="0.01" name="goal" value="{{user['savings_goal']}}"></label><label><input type="checkbox" name="dark_mode" {% if user['dark_mode'] %}checked{% endif %}> Enable Dark Mode</label><button>Save Settings</button></form></section></main></body></html>
