<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Personal Finance Tracker</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="auth"><div class="auth-card"><h1>💰 Personal Finance Tracker</h1><p>Login to manage your finances.</p>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="alert">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><input name="username" placeholder="Username" required><input type="password" name="password" placeholder="Password" required><button>Login</button></form><p>New user? <a href="{{url_for('register')}}">Create account</a></p></div></body></html>
