<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - Personal Finance Tracker</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="auth"><div class="auth-card"><h1>Create Account</h1><p>Start tracking your income and expenses.</p>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="alert">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><input name="username" placeholder="Username" required><input type="password" name="password" placeholder="Password" required><button>Register</button></form><p>Already have an account? <a href="{{url_for('login')}}">Login</a></p></div></body></html>
